model:
  vocab_size: 512
  max_seq_len: 128
  n_layers: 2
  hidden_size: 128
  n_heads: 4
  n_kv_heads: 2
  ffn_size: 352
  dropout: 0.0
  tie_embeddings: true
  rope_theta: 10000.0

training:
  seed: 42
  batch_size: 2
  grad_accum_steps: 1
  epochs: 1
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 5
  max_steps: 20
  log_every: 1
  save_every: 10
  output_dir: checkpoints/nano-smoke
  dataset: data/examples/corpus.txt
