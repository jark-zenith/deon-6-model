model:
  vocab_size: 65536
  max_seq_len: 8192
  n_layers: 12
  hidden_size: 768
  n_heads: 12
  n_kv_heads: 4
  ffn_size: 2048
  dropout: 0.0
  tie_embeddings: true
  rope_theta: 10000.0

training:
  seed: 42
  batch_size: 1
  grad_accum_steps: 32
  epochs: 1
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 100000
  log_every: 10
  save_every: 1000
  output_dir: checkpoints/deon6-nano
  dataset: data/train/manifest.jsonl
